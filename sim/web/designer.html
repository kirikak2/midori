<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDoRI Designer</title>
<style>
  :root {
    --bg: #f6f7f6; --fg: #1d211e; --muted: #5b625d; --panel: #ffffff; --line: #d7dcd8;
    --accent: #1f8a4c; --accent-fg: #ffffff; --code-bg: #fbfcfb; --err: #b3261e;
    --cell: #eef1ef; --cell-hover: #dfe6e1; --sel: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111412; --fg: #e3e8e4; --muted: #9aa39c; --panel: #1a1e1b; --line: #2c322e;
      --accent: #3fbf73; --accent-fg: #0b130e; --code-bg: #141815; --err: #f2b8b5;
      --cell: #202622; --cell-hover: #29312c; --sel: #3fbf73;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111412; --fg: #e3e8e4; --muted: #9aa39c; --panel: #1a1e1b; --line: #2c322e;
    --accent: #3fbf73; --accent-fg: #0b130e; --code-bg: #141815; --err: #f2b8b5;
    --cell: #202622; --cell-hover: #29312c; --sel: #3fbf73;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header input[type=text] { width: 14em; }
  button, select, input, textarea { font: inherit; color: var(--fg); }
  button, select { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.small { padding: 1px 8px; font-size: 12px; }
  input[type=text], input[type=number], textarea { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); min-width: 0; }
  main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.3fr) minmax(260px, 0.9fr); gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr 1fr; } #inspector-col { grid-column: 1 / -1; } }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  section.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .palette { display: flex; flex-wrap: wrap; gap: 4px; }
  .palette label { border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; user-select: none; }
  .palette input { display: none; }
  .palette input:checked + span { color: var(--accent); font-weight: 700; }
  #grid { display: grid; gap: 4px; user-select: none; touch-action: none; margin-top: 8px; aspect-ratio: 16 / 9; }
  #grid[data-board="cores3"] { aspect-ratio: 4 / 3; }
  .cell { background: var(--cell); border-radius: 4px; min-height: 18px; }
  .cell.pending { outline: 2px dashed var(--sel); }
  .widget { border-radius: 6px; border: 2px solid transparent; display: flex; align-items: center; justify-content: center;
            font-size: 12px; text-align: center; padding: 2px; overflow: hidden; cursor: pointer; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .widget.sel { border-color: var(--fg); box-shadow: 0 0 0 2px var(--sel); }
  .widget.bad { outline: 3px solid var(--err); }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .device { background: #000; border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.25); margin: 0 auto; }
  .device[data-board="cores3"] { max-width: 664px; border-radius: 22px; padding: 20px; }
  .device[data-board="cores3"] canvas { image-rendering: pixelated; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; border-radius: 4px; background: #000; }
  #log { height: 120px; overflow: auto; margin: 10px 0 0; padding: 6px 8px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #log .err { color: var(--err); }
  #log .sys { color: var(--muted); }
  .field { display: grid; grid-template-columns: 9em 1fr; gap: 6px; align-items: center; margin: 4px 0; }
  .field textarea { width: 100%; min-height: 70px; font: 12px/1.4 ui-monospace, monospace; }
  .field input[type=text], .field input[type=number], .field select { width: 100%; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
  #problems li { color: var(--err); }
  details summary { cursor: pointer; color: var(--muted); }
  #code { width: 100%; height: 320px; font: 12px/1.45 ui-monospace, monospace; white-space: pre; overflow: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>MIDoRI Designer <small style="color:var(--muted);font-weight:normal">試作</small></h1>
  <input type="text" id="name" aria-label="Project name">
  <select id="board" aria-label="Board"></select>
  <button id="new">新規</button>
  <button id="open">開く…</button>
  <button id="save" class="primary">保存（.rb）</button>
  <button id="to-sim">シミュレーターで開く</button>
  <input type="file" id="file" accept=".rb,text/plain" hidden>
  <a href="./index.html" style="margin-left:auto">シミュレーター →</a>
</header>
<main>
  <div>
    <section class="card">
      <h2>レイアウト</h2>
      <div class="tabs" id="tabs"></div>
      <div class="row">
        <label>タイトル <input type="text" id="title" style="width:10em"></label>
        <label>列 <input type="number" id="cols" min="1" max="12" style="width:4em"></label>
        <label>行 <input type="number" id="rows" min="1" max="12" style="width:4em"></label>
        <button class="small" id="del-layout">削除</button>
      </div>
      <div class="row">
        <label><input type="radio" name="start" id="start"> 最初に表示する</label>
      </div>
    </section>
    <section class="card">
      <h2>部品</h2>
      <div class="palette" id="palette"></div>
      <div id="grid" aria-label="Layout grid"></div>
      <p class="hint">空いたセルをドラッグして部品を置く。部品をクリックで選択、Delete で削除。</p>
    </section>
  </div>
  <div>
    <div class="device" id="device"><canvas id="screen" width="1280" height="720" aria-label="Preview"></canvas></div>
    <p class="hint">プレビューは実機と同じ描画で、そのまま操作できます。変更すると作り直します。</p>
    <div id="log" role="log" aria-live="polite"></div>
    <details>
      <summary>生成されるスクリプト</summary>
      <pre id="code"></pre>
    </details>
  </div>
  <div id="inspector-col">
    <section class="card">
      <h2>インスペクタ</h2>
      <div id="inspector"><p class="hint">部品を選ぶと設定が出ます。</p></div>
    </section>
    <section class="card">
      <h2>デバイス</h2>
      <div id="devices"></div>
      <button class="small" id="add-device">デバイスを追加</button>
    </section>
    <section class="card" id="problems-card" hidden>
      <h2>問題</h2>
      <ul id="problems"></ul>
    </section>
  </div>
</main>
<script type="module">
const BUILD = await fetch('./wasm/build.json', { cache: 'no-store' })
  .then(r => (r.ok ? r.json() : {})).then(j => String(j.id || Date.now()))
  .catch(() => String(Date.now()));
const load = name => import(`./${name}?v=${encodeURIComponent(BUILD)}`);
const [{ startDesigner }] = await Promise.all([load('designer/app.js')]);
startDesigner(BUILD);
</script>
</body>
</html>
