# Push a tag like v1.0.0 (or v1.1.0-rc.1 for a pre-release) to build every
# target, publish a GitHub Release with the images, and update the web
# installer on GitHub Pages.
#
#   git tag -a v1.0.0 -m "MIDoRI 1.0.0"
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "MIDoRI ${TAG#v}" --generate-notes --verify-tag)
          # A hand-written changelog for this version wins over the notes
          # generated from pull requests.
          if [ -f "docs/releases/${TAG}.md" ]; then
            flags+=(--notes-file "docs/releases/${TAG}.md")
          fi
          case "$TAG" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"

  # A release published with GITHUB_TOKEN does not trigger other workflows,
  # so the site is rebuilt from here.
  pages:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/pages.yml
